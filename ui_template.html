<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#26211c;color:#f3ece0;font-family:"Segoe UI",sans-serif;overflow:hidden;user-select:none}
input::placeholder{color:#8a806f}
#app{height:100vh;display:flex}
#app.tabs{flex-direction:column}#app.rail{flex-direction:row}
/* навигация */
.tabs-bar{display:flex;background:#1b1814;border-bottom:3px solid #000;flex:none;overflow:hidden}
.tab{display:flex;align-items:center;gap:10px;padding:8px 16px;border-right:3px solid #000;cursor:pointer;font:900 13px "Segoe UI";white-space:nowrap;color:#f3ece0}
.tab img{width:36px;height:36px}
.tab.sys{border-right:0;border-left:3px solid #000;padding:8px 12px}
.tab:hover{background:#2e2a22}
.rail-bar{width:90px;flex:none;background:#1b1814;border-right:3px solid #000;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
.rb{padding:4px;cursor:pointer;border:3px solid transparent}
.rb img{width:48px;height:48px;display:block}
.sp{flex:1}
/* шапка режима */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.plate{border-bottom:3px solid #000;padding:14px 20px 16px;color:#000;flex:none;box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -6px 0 rgba(0,0,0,.2)}
.plate.flat{padding:16px 20px;font:900 24px "Segoe UI"}
.ph{display:flex;align-items:center;gap:12px}
.ph img{width:60px;height:60px}
.ph h1{font:900 24px "Segoe UI";letter-spacing:-.5px}
.ph p{font:700 12px "Segoe UI"}
.acc{position:relative;z-index:20;flex:none}
.accb{display:flex;align-items:center;gap:8px;cursor:pointer;border:3px solid #000;background:#14110e;box-shadow:3px 3px 0 #000;padding:3px 10px 3px 3px;color:#f3ece0}
.av{width:30px;height:30px;border:2px solid #000;display:grid;place-items:center;font:900 13px "Segoe UI";color:#000;background:#6b6252}
.accb span{font:900 12px "Segoe UI";white-space:nowrap}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:230px;background:#26211c;border:3px solid #000;box-shadow:6px 6px 0 #000;color:#f3ece0}
.pop p{padding:12px 12px 0;font:600 12px "Segoe UI";color:#a99f8e;line-height:1.4}
.pop .btn{margin:10px 12px 12px}
/* командная строка */
.cmdw{position:relative;margin-top:14px;z-index:10}
.cmd{display:flex;border:3px solid #000;background:#14110e;box-shadow:5px 5px 0 #000;color:#f3ece0}
.segs{display:flex;border-right:3px solid #000;flex:none}
.segs div{padding:11px 14px;cursor:pointer;font:900 12px "Segoe UI";background:#14110e;color:#a99f8e}
.segs div.on{background:#f3ece0;color:#000}
.cmd input{flex:1;min-width:0;background:none;border:0;outline:0;color:#f3ece0;padding:0 14px;font:700 14px "Segoe UI";user-select:text}
.cb{display:grid;place-items:center;border-left:3px solid #000;cursor:pointer}
.cb.hist{width:44px}.cb.hist.on{background:#ffc83d;color:#000}
.cb.paste{padding:11px 14px;font:900 12px "Segoe UI";background:#f3ece0;color:#000}
.cb.go{padding:11px 18px;font:900 13px "Segoe UI";background:#000;color:#f3ece0;white-space:nowrap;flex:none;border-left:0}
.cb:hover,.segs div:hover{filter:brightness(1.12)}
.hd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#26211c;border:3px solid #000;box-shadow:6px 6px 0 #000;color:#f3ece0;max-height:260px;overflow:auto}
.hd .h{display:flex;padding:8px 12px;background:#1b1814;border-bottom:3px solid #000;font:900 11px "Segoe UI";letter-spacing:1px}
.hd .h u{color:#a99f8e;cursor:pointer;text-underline-offset:3px;font-weight:700}
.hi{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:3px dashed rgba(255,255,255,.12);cursor:pointer}
.hi:hover{background:#2e2a22}
.th{background:#14110e center/cover;border:2px solid #000;flex:none}
.hi .m{flex:1;min-width:0}.hi b{display:block;font:800 13px "Segoe UI";white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hi small{font:700 11px "Segoe UI";color:#a99f8e}
.mini{padding:4px 10px;background:#f3ece0;color:#000;border:2px solid #000;font:900 11px "Segoe UI"}
.mini.dk{background:#14110e;color:#f3ece0;padding:4px 8px}
.stat{min-height:24px;margin-top:10px;display:flex;align-items:center;gap:10px;font:800 12px "Segoe UI";flex-wrap:wrap}
.chip{background:#000;padding:3px 9px}
.chip.act{cursor:pointer;color:#f3ece0}

.body{flex:1;min-height:0;overflow:auto;padding:14px 20px 16px;display:flex;flex-direction:column;gap:16px}
.lab{font:900 11px "Segoe UI";letter-spacing:1px;color:#a99f8e;margin-bottom:8px}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.quick .lab{margin:0 4px 0 0;white-space:nowrap}
.qb{padding:6px 12px;background:#1b1814;border:3px solid #000;box-shadow:3px 3px 0 #000;font:800 12px "Segoe UI";white-space:nowrap;cursor:pointer;color:#f3ece0}

.pv{display:flex;background:#3a342c;border:3px solid #000;box-shadow:5px 5px 0 #000}

.ib:hover{transform:translate(-1px,-1px)}.ib.on{background:#ffc83d;color:#000}
.ib svg{display:block}
.card .im span.d{left:auto;top:auto;right:6px;bottom:6px}
.card .im span{position:absolute;left:6px;top:6px;background:#000;font:800 10px "Segoe UI";padding:2px 6px}
.card .t{padding:8px 10px;flex:1;font:800 13px "Segoe UI";line-height:1.3;word-break:break-word}
.card .t small{display:block;font:700 11px "Segoe UI";color:#a99f8e;margin-top:3px}
.card .acts{display:flex;gap:0;border-top:3px solid #000}
.card .acts div{padding:7px 10px;cursor:pointer;font:900 11px "Segoe UI";text-align:center}
.card .acts .p{flex:1;background:#f3ece0;color:#000}
.card .acts .f{border-left:3px solid #000;background:#14110e}.card .acts .f.on{background:#ffc83d;color:#000}
.empty{border:3px dashed #6b6252;padding:28px;text-align:center;font:800 13px "Segoe UI";color:#a99f8e}
.feeds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.feed{padding:10px 12px;cursor:pointer;background:#1b1814;border:3px solid #000;box-shadow:3px 3px 0 #000}
.feed b{display:block;font:900 13px "Segoe UI"}.feed small{font:600 11px "Segoe UI";color:#a99f8e}
.feed:hover{transform:translate(-1px,-1px)}

.scard{background:#3a342c;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:4px 16px}
.scard.p14{padding:14px 16px}
.sh{font:900 12px "Segoe UI";letter-spacing:1.2px;color:#b4b4ff;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{cursor:pointer;border:3px solid #000;padding:10px;background:#26211c;box-shadow:3px 3px 0 #000}

.opt .mk{height:46px;border:3px solid #000;background:#26211c;display:flex}

.opt b{display:block;font:900 13px "Segoe UI";margin-top:8px}.opt small{font:600 11px "Segoe UI"}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;border-bottom:3px dashed rgba(255,255,255,.14)}
.srow:last-child{border-bottom:0}
.srow .x{flex:1}.srow b{display:block;font:800 14px "Segoe UI"}.srow small{display:block;font:600 12px "Segoe UI";color:#a99f8e}
.tg{width:48px;height:28px;border:3px solid #000;background:#14110e;position:relative;flex:none}
.tg i{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#f3ece0;border:3px solid #000;content:"";box-sizing:content-box}
.tg.on{background:var(--ac,#b4b4ff)}.tg.on i{left:20px}
.sg{display:flex;border:3px solid #000;box-shadow:3px 3px 0 #000}
.sg div{padding:5px 12px;cursor:pointer;background:#3a342c;border-right:3px solid #000;font:800 11px "Segoe UI";white-space:nowrap}
.sg div:last-child{border-right:0}.sg div.on{background:var(--ac,#b4b4ff);color:#000}
.note{font:600 12px "Segoe UI";color:#a99f8e;line-height:1.5}
::-webkit-scrollbar{width:10px;background:#1b1814}::-webkit-scrollbar-thumb{background:#3a342c;border:2px solid #000}

 <div class="note">Режимы «Минимум / Средний / Полный» меняют переключатели TikTok набором. Ручное изменение даёт «свой набор».</div></div>`;
}
let lastScr='';
window.__mpSync=async()=>{try{const S2=await api.state();S.history=S2.history;S.settings=S2.settings;render()}catch(e){}};
function render(){
 const oldBody=document.querySelector('.body'),keepScroll=oldBody&&lastScr===scr?oldBody.scrollTop:0;lastScr=scr;
 const keep=document.activeElement&&document.activeElement.id==='q'?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;
 const L=S.settings.ui.layout||'tabs';
 let main=ORDER.includes(scr)?platform(scr):scr==='fav'?favScreen():setScreen();
 $('#app').className=L;
 $('#app').innerHTML=nav()+`<div class="main">${main}</div>`;
 const nb=document.querySelector('.body');if(nb&&keepScroll)nb.scrollTop=keepScroll;
 document.body.style.setProperty('--ac',(PL[scr]||{}).c||'#b4b4ff');
 const i=$('#q');if(i&&keep){i.focus();i.setSelectionRange(keep[0],keep[1])}
}
function doPreview(){
 const p=PL[scr],t=q.trim();clearTimeout(pvTimer);
 if(!p||curMode()!=='link'||!t||!p.test(t)||/^@/.test(t)||(scr==='tw'&&!/\//.test(t))){pv=null;return}
 pvFor=t;pvTimer=setTimeout(async()=>{let d=null;try{d=await api.preview(t)}catch(e){}
   if(pvFor===t){pv=d;if(q.trim()===t)render()}},450);
}
async function play(link,m,resume){
 msg='';const r=await api.play(link,m||(PL[scr]?PL[scr].mode:''),!!resume);
 if(r.error){msg=r.error}else{S=r.state;q='';pv=null;histOpen=false;await refresh()}
 render();
}
async function refresh(){S=await api.state()}
function submit(){
 const p=PL[scr],t=q.trim();histOpen=false;
 if(!t){msg='';const home=scr==='ot'?({google:'https://www.google.com',duck:'https://duckduckgo.com',brave:'https://search.brave.com',bing:'https://www.bing.com'}[S.settings.ui.engine]||'https://www.google.com'):HOME[scr];api.site(home,!!p.vertical);render();return}
 msg='';
 if(curMode()==='search'){
  if(p.realSearch){searched=true;if(!sr||srFor!==t){sr=null;srFor=t;srLoadingAll=true;render();api.search(t,scr).then(r=>{srLoadingAll=false;if(srFor===t){sr=r;if(r===null){api.site(p.search_url(t),!!p.vertical)}render()}})}else render();return}
  api.site(p.search_url(t),!!p.vertical);return}
 if(!p.test(t)){render();return}
 play(t);
}
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;msg='';searched=false;doPreview();doSearch();
  const p=PL[scr];// обновить только статус и предпросмотр
  render()}});
document.addEventListener('keydown',e=>{if(e.target.id==='q'&&e.key==='Enter')submit()});
document.addEventListener('click',async e=>{
 const el=e.target.closest('[data-act],[data-go],[data-play],[data-fav],[data-rm],[data-pin],[data-site]');
 if(!el){if(e.target.closest('.pop,.hd'))return;if(histOpen||accOpen){histOpen=accOpen=false;render()}return}
 const d=el.dataset;
 if(d.go){if(d.go!==scr){q='';pv=null;sr=null;searched=false}if(PL[d.go])lastPlat=d.go;scr=d.go;histOpen=accOpen=false;msg='';render();return}
 if(d.site){api.site(d.site,!!d.v);return}
 if(d.play){play(d.play);return}
 if(d.favlink){S=await api.fav_link(d.favlink);render();return}
 if(d.rm){S=await api.remove(d.rm);render();return}
 if(d.pin){S=await api.pin_item(d.pin);render();return}
 if(d.fav){S=await api.fav(d.fav);render();return}
 const a=d.act,p=PL[scr];
 if(a==='acc'){accOpen=!accOpen;histOpen=false;render();if(accOpen)refreshLogin(true)}
 else if(a==='asw'){if(d.id!==((S.acc[scr]||{}).active)){accErr='';const r=await api.acc_switch(scr,d.id);S.login=r.login;S.acc=r.acc;S.pending=r.pending;accErr=r.error||'';render()}}
 else if(a==='axp'){accExp=accExp===d.id?null:d.id;accDel=null;render()}
 else if(a==='adel'){accDel=d.id;render()}
 else if(a==='acan'){accDel=null;render()}
 else if(a==='ado'){const r=await api.acc_remove(scr,d.id);S.login=r.login;S.acc=r.acc;S.pending=r.pending;accExp=accDel=null;render()}
 else if(a==='aadd'){const r=await api.acc_add(scr);S.login=r.login;S.acc=r.acc;S.pending=r.pending;accErr=r.error||'';accOpen=false;render();loginAt=0;setTimeout(()=>refreshLogin(true),3000)}
 else if(a==='alogout'){const r=await api.logout(scr);S.login=r.login;S.acc=r.acc;S.pending=r.pending;accOpen=false;accExp=accDel=null;loginAt=0;render()}
 else if(a==='login'){accOpen=false;api.site(p.login,!!p.vertical);render()}
 else if(a==='hist'){histOpen=!histOpen;accOpen=false;render()}
 else if(a==='clr'){S=await api.clear(false);render()}
 else if(a==='mlink'){mode[scr]='link';pv=null;sr=null;searched=false;render();doPreview()}
 else if(a==='msearch'){mode[scr]='search';pv=null;searched=false;render();doSearch()}
 else if(a==='tosearch'){mode[scr]='search';searched=false;render();doSearch()}
 else if(a==='paste'){q=(await api.clipboard()).trim();mode[scr]='link';msg='';doPreview();render()}
 else if(a==='submit')submit();
 else if(a==='play')play(q.trim());
 else if(a==='resume'){play(d.u,undefined,true)}
 else if(a==='pvfav'){S=await api.fav_link(q.trim());render()}
 else if(a==='layout'){S=await api.ui_setting('layout',d.v);render()}
 else if(a==='ui'){S=await api.ui_setting(d.k,!S.settings.ui[d.k]);render()}
 else if(a==='bypass'){const on=!BP.on;BP=Object.assign({},BP,{on:on,state:on?'starting':'off',msg:on?'Запуск':''});render();api.bypass_set(on);setTimeout(bpRefresh,500)}
 else if(a==='bprt'){api.bypass_retest();setTimeout(bpRefresh,300)}
 else if(a==='upcheck'){UP=Object.assign(UP||{},{busy:true,error:''});render();const r=await api.update_check();UP=Object.assign(UP||{},r,{busy:false,checked:true});render()}
 else if(a==='upinstall'){UP=Object.assign(UP||{},{busy:true,error:''});render();try{await api.update_install(UP.url)}catch(e){UP=Object.assign(UP,{busy:false,error:String(e)});render()}}
 else if(a==='top'){S=await api.setting('on_top',!S.settings.on_top);render()}
 else if(a==='size'){S=await api.setting('size',d.v);render()}
 else if(a==='engine'){S=await api.ui_setting('engine',d.v);render()}
 else if(a==='ytexit'){S=await api.ui_setting('yt_exit_to',d.v);render()}
 else if(a==='tt'){const cur=d.k in ttFlags()?ttFlags()[d.k]:true;S=await api.tt_setting(d.k,!cur);render()}
 else if(a==='ttpre'){const f=PRE[d.v];for(const k of Object.keys(f))S=await api.tt_setting(k,!!f[k]);render()}
});
window.addEventListener('focus',()=>{if(!api)return;window.__mpSync();if(ORDER.includes(scr))refreshLogin()});
window.addEventListener('pywebviewready',async()=>{
 api=pywebview.api;S=await api.state();bpRefresh();setTimeout(()=>refreshLogin(),600);
 const c=S.settings.ui.auto_paste?(await api.clipboard()).trim():'';
 const k=/youtu/i.test(c)?'yt':/tiktok/i.test(c)?'tt':/twitch\.tv/i.test(c)?'tw':/netflix\.com/i.test(c)?'nf':/vimeo/i.test(c)?'ot':null;
 if(/^https?:\/\//i.test(c)&&k){scr=k;q=c;doPreview()}
 render();const i=$('#q');if(i)i.focus();
});
render();
</script></body></html>
