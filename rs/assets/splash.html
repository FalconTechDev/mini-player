<!doctype html><html><head><meta charset="utf-8"><title>Mini Player</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",sans-serif;user-select:none}
.box{position:absolute;inset:3px;background:#ffc83d;padding:10px 14px;box-sizing:border-box}
.t{font:700 15px "Segoe UI";color:#000}
.h{font:700 12px "Segoe UI";color:#000;margin-top:2px}
.s{font:400 11px "Segoe UI";color:#3a342c;margin-top:4px;line-height:1.3;white-space:pre-line}
</style></head><body><div class="box"><div class="t">Mini Player</div><div class="h" id="h">Подождите, включаю обход блокировок…</div><div class="s" id="s"></div></div>
<script>
let t0=Date.now(),doneAt=0;
async function tick(){
 let b={};try{b=await pywebview.api.bypass_info()}catch(e){}
 const busy=b.state==='starting'||b.state==='testing';
 if(busy&&Date.now()-t0<120000){document.getElementById('s').textContent=b.msg||'';return}
 const ok=b.state==='on'||b.state==='unneeded';
 document.getElementById('h').textContent=b.state==='on'?'Обход включён':b.state==='unneeded'?'Обход не нужен':'Не удалось включить обход';
 document.getElementById('s').textContent=(b.msg||'')+(ok?'':'\nПодробности: Настройки, Режим обхода блокировок');
 if(!doneAt)doneAt=Date.now();
 if(Date.now()-doneAt>(ok?1200:5000)){pywebview.api.splash_close()}
}
window.addEventListener('pywebviewready',()=>{tick();setInterval(tick,300)});
</script></body></html>
